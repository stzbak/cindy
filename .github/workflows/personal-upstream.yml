name: personal-upstream

on:
  schedule:
    - cron: '45 23 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

env:
  XDT_SKIP_AGENT_BIN_INSTALL: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  ELECTRON_OVERRIDE_DIST_PATH: '${{ github.workspace }}/.electron-stub-dist'
  NODE_OPTIONS: '--max-old-space-size=8192'
  PERSONAL_ANDROID_PACKAGE: 'com.stzbak.cindy'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.result.outputs.status }}
      changed: ${{ steps.result.outputs.changed }}
      upstream_sha: ${{ steps.result.outputs.upstream_sha }}
      candidate_sha: ${{ steps.result.outputs.candidate_sha }}
      previous_head: ${{ steps.result.outputs.previous_head }}
    steps:
      - name: Checkout Personal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: personal
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Configure rebase identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase Personal commit stack
        id: sync
        continue-on-error: true
        run: node scripts/personal/sync-upstream.mjs --result-file "$RUNNER_TEMP/personal-sync.json"

      - name: Read sync result
        id: result
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = process.env.RUNNER_TEMP + '/personal-sync.json';
          const result = JSON.parse(fs.readFileSync(file, 'utf8'));
          const output = process.env.GITHUB_OUTPUT;
          const lines = [
            'status=' + result.status,
            'changed=' + (result.status === 'rebased' ? 'true' : 'false'),
            'upstream_sha=' + result.upstreamSha,
            'candidate_sha=' + result.currentHead,
            'previous_head=' + result.previousHead,
          ];
          fs.appendFileSync(output, lines.join('\n') + '\n');
          const summary = [
            '## Personal upstream sync',
            '',
            '- Status: ' + result.status,
            '- Upstream: ' + (result.upstreamSha || '(unknown)'),
            '- Previous HEAD: ' + (result.previousHead || '(unknown)'),
            '- Current HEAD: ' + (result.currentHead || '(unknown)'),
            '- Commits replayed: ' + result.commitsReplayed,
          ];
          if (result.conflictFiles.length) {
            summary.push('', 'Conflict files:', ...result.conflictFiles.map((file) => '- ' + file));
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          if (!['rebased', 'up-to-date'].includes(result.status)) process.exit(1);
          NODE

      - name: Push isolated candidate branch
        if: steps.result.outputs.changed == 'true'
        run: |
          ref=refs/heads/automation/upstream-sync-staging
          previous=$(git ls-remote origin "$ref" | cut -f1)
          git push --force-with-lease="$ref:$previous" origin "HEAD:$ref"

  dispatch-release:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the single verified build and publication pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.sync.outputs.changed }}
          PREVIOUS_HEAD: ${{ needs.sync.outputs.previous_head }}
        run: |
          if [ "$CHANGED" = true ]; then
            gh workflow run personal-release.yml --repo "$GITHUB_REPOSITORY" --ref automation/upstream-sync-staging -f expected_previous_head="$PREVIOUS_HEAD"
          else
            gh workflow run personal-release.yml --repo "$GITHUB_REPOSITORY" --ref personal
          fi

  report-failure:
    needs: [sync, dispatch-release]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open or update automation failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[Personal upstream] automation failed'
          body="$RUNNER_TEMP/personal-failure.md"
          cat > "$body" <<BODY
          Personal upstream synchronization or release dispatch failed.

          - Run: ${RUN_URL}
          - The last published release remains available.
          - Review this run; the release pipeline separately reports test/build/publication failures.
          BODY
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"[Personal upstream] automation failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi
