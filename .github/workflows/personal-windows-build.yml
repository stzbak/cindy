name: personal-windows-build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: number
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: personal-windows-build
  cancel-in-progress: false

env:
  XDT_SKIP_AGENT_BIN_INSTALL: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  ELECTRON_OVERRIDE_DIST_PATH: '${{ github.workspace }}/.electron-stub-dist'
  NODE_OPTIONS: '--max-old-space-size=8192'
  CINDY_PERSONAL_BUILD: '1'
  PERSONAL_APP_VERSION: ${{ inputs.version }}
  PERSONAL_BUILD_NUMBER: ${{ inputs.build_number }}
  PERSONAL_RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Personal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bake Personal update build identity
        shell: pwsh
        run: |
          "export const PERSONAL_BUILD_NUMBER: number = $env:PERSONAL_BUILD_NUMBER;" | Set-Content 'apps/desktop/src/shared/personalBuild.ts' -Encoding utf8NoBOM

      - name: Build unsigned Windows installer
        shell: pwsh
        run: pnpm release:package -- --platform win32 --arch x64 --region cn --version "$env:PERSONAL_APP_VERSION" --no-sign

      - name: Prepare release assets
        shell: pwsh
        run: |
          $artifactDir = "apps/desktop/release/artifacts/cn/$env:PERSONAL_APP_VERSION/win32-x64"
          $installer = Get-ChildItem $artifactDir -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          $outDir = Join-Path $env:RUNNER_TEMP 'personal-windows-release'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $target = Join-Path $outDir 'cindy-personal-windows-cn-x64.exe'
          Copy-Item $installer.FullName $target
          $buildInfo = Join-Path $artifactDir 'build-info.json'
          $info = Get-Content $buildInfo -Raw | ConvertFrom-Json
          if ($info.region -ne 'cn' -or $info.platform -ne 'win32' -or $info.arch -ne 'x64' -or $info.commitSha -ne $env:GITHUB_SHA -or $info.version -ne $env:PERSONAL_APP_VERSION -or $info.versionless) {
            throw 'Windows build metadata does not match the requested CN source/platform'
          }
          Copy-Item $buildInfo (Join-Path $outDir 'build-info.json')
          $hotfix = Get-ChildItem $artifactDir -Filter '*-hotfix.zip' | Select-Object -First 1
          if (-not $hotfix) { throw 'Windows hotfix ZIP is missing' }
          $hotfixTarget = Join-Path $outDir "cindy-personal-windows-cn-x64-$env:PERSONAL_BUILD_NUMBER-hotfix.zip"
          Copy-Item $hotfix.FullName $hotfixTarget
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:PERSONAL_RELEASE_TAG/"
          $app = @{
            version = $env:PERSONAL_APP_VERSION
            personalBuildNumber = [int]$env:PERSONAL_BUILD_NUMBER
            installer = @{ file = $baseUrl + (Split-Path $target -Leaf); sha256 = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant(); size = (Get-Item $target).Length }
            hotfix = @{ file = $baseUrl + (Split-Path $hotfixTarget -Leaf); sha256 = (Get-FileHash $hotfixTarget -Algorithm SHA256).Hash.ToLowerInvariant(); size = (Get-Item $hotfixTarget).Length }
          }
          @{ region = 'cn'; platform = 'win32-x64'; sourceCommit = $env:GITHUB_SHA; app = $app } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $outDir 'cindy-personal-windows.json') -Encoding utf8NoBOM
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cindy-personal-windows-cn-x64.exe" | Set-Content (Join-Path $outDir 'SHA256SUMS') -Encoding utf8NoBOM
          Get-ChildItem $outDir | Format-Table Name,Length

      - name: Upload validated Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-windows-release
          path: ${{ runner.temp }}/personal-windows-release/*
          if-no-files-found: error
